name: Build KahaniFilm APK

on:
  workflow_dispatch:
  push:
    branches:
      - kahanifilm-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-23" "platforms;android-34" "build-tools;34.0.0"
          sudo apt-get update
          sudo apt-get install -y curl zip unzip
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Prepare build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore tools/debug.keystore \
            -storepass android \
            -keypass android \
            -alias kahani \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KahaniFilm,O=Development,C=IN" \
            -noprompt
        continue-on-error: true

      - name: Build APK
        shell: bash
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-23/android.jar
          ALL_JAR: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
        run: |
          bash ./build.sh

      - name: Verify APK
        shell: bash
        run: |
          test -s release/KahaniFilm.apk
          ls -lh release/KahaniFilm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KahaniFilm-debug-apk
          path: release/KahaniFilm.apk
          if-no-files-found: error
