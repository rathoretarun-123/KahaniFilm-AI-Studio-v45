name: Build KahaniFilm APK

on:
  workflow_dispatch:
  push:
    branches:
      - kahanifilm-development
      - ccr-a5fc4eef-d2p2nm

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write    # the apk branch (the direct download link)

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" was removed from the Android SDK repository; install only current packages.
          packages: platform-tools

      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-23" "platforms;android-34" "build-tools;34.0.0"

      - name: Install build utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip python3-pil
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Prepare debug signing key
        shell: bash
        run: |
          mkdir -p tools
          if [ ! -f tools/debug.keystore ]; then
            keytool -genkeypair \
              -keystore tools/debug.keystore \
              -storepass android \
              -keypass android \
              -alias kahani \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KahaniFilm,O=Development,C=IN" \
              -noprompt
          fi

      - name: Import and validate both films' committed asset packets
        shell: bash
        run: |
          set -euo pipefail
          bash tools/scripts/prepare_bundled_film_assets.sh

      - name: Build APK
        shell: bash
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-23/android.jar
          ALL_JAR: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
          KAHANIFILM_ASSETS_PREPARED: "1"
        run: |
          bash ./build.sh

      - name: Verify APK and bundled story payload
        shell: bash
        run: |
          set -euo pipefail
          test -s release/KahaniFilm.apk
          ls -lh release/KahaniFilm.apk
          unzip -l release/KahaniFilm.apk | grep -q 'assets/film_library/aakhiri_chai/stills/'
          unzip -l release/KahaniFilm.apk | grep -q 'assets/film_library/babu_ke_liye/stills/'
          unzip -l release/KahaniFilm.apk | grep -q 'assets/film_library/aakhiri_chai/videos/user_uploaded_reference.mp4'
          unzip -l release/KahaniFilm.apk | grep -q 'assets/film_library/babu_ke_liye/videos/user_uploaded_reference.mp4'
          unzip -p release/KahaniFilm.apk assets/film_library/aakhiri_chai/videos/user_uploaded_reference.mp4 | dd bs=1 skip=4 count=4 2>/dev/null | grep -q 'ftyp'
          unzip -p release/KahaniFilm.apk assets/film_library/babu_ke_liye/videos/user_uploaded_reference.mp4 | dd bs=1 skip=4 count=4 2>/dev/null | grep -q 'ftyp'
          echo "APK contains both story still collections and valid reference MP4 assets."

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KahaniFilm-v47-apk
          path: release/KahaniFilm-v47.apk
          if-no-files-found: error

      - name: Upload APK (legacy name alias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KahaniFilm-debug-apk
          path: release/KahaniFilm.apk
          if-no-files-found: error

      # The user installs from the phone: a raw file on a branch downloads directly (an artifact is a zip behind a login).
      # https://github.com/rathoretarun-123/KahaniFilm-AI-Studio-v45/raw/apk/KahaniFilm.apk is always the latest build of
      # this branch; the commit it came from is in the file name beside it and in README.md there.
      - name: Publish the APK to the apk branch (direct download link)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          cp release/KahaniFilm-v47.apk "$d/KahaniFilm.apk"
          cp release/KahaniFilm-v47.apk "$d/KahaniFilm-${GITHUB_SHA::7}.apk"
          cd "$d"
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          printf 'KahaniFilm APK built by CI from commit %s on %s (%s).\n\nDirect download: https://github.com/%s/raw/apk/KahaniFilm.apk\nSource of this build: https://github.com/%s/archive/%s.zip\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%MZ)" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > README.md
          git add .
          git commit -q -m "APK built from $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk:apk
          echo "published: https://github.com/${GITHUB_REPOSITORY}/raw/apk/KahaniFilm.apk"


      - name: Set up Java 21 for production-plan regression tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Robolectric Android framework
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/kahani"
          URL_PATH="org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar"
          curl -fL --retry 3 --retry-delay 2 -o "$HOME/.cache/kahani/android-all-14.jar" "https://repo.maven.apache.org/maven2/$URL_PATH" \
            || curl -fL --retry 3 --retry-delay 2 -o "$HOME/.cache/kahani/android-all-14.jar" "https://repo1.maven.org/maven2/$URL_PATH"

      - name: Prepare missing synthetic legacy test fixtures
        shell: bash
        run: python3 tools/scripts/prepare_legacy_test_fixtures.py
      - name: Stage generated voice fixtures for Robolectric working directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/robotest/voices
          cp voices/man.wav voices/deep_slow.wav voices/woman.wav voices/child.wav tools/robotest/voices/
          test -s tools/robotest/voices/man.wav
          test -s tools/robotest/voices/deep_slow.wav
          test -s tools/robotest/voices/woman.wav
          test -s tools/robotest/voices/child.wav
      - name: Convert bundled WebP references for desktop render tests
        shell: bash
        run: python3 tools/scripts/prepare_render_reference_images.py

      - name: Run production-plan, app regression, and 1,000-pass render soak tests
        shell: bash
        run: |
          set -o pipefail
          gradle -p tools/robotest test --continue \
            --tests com.tarun.kahani.ProductionPlanTest \
            --tests com.tarun.kahani.AppTest \
            --tests com.tarun.kahani.HundredPassSoakTest \
            --tests com.tarun.kahani.AakhiriChaiAcceptanceTest \
            --tests com.tarun.kahani.AakhiriChaiDesktopRenderTest \
            --tests com.tarun.kahani.BabuKeLiyeDesktopRenderTest \
            --tests com.tarun.kahani.NarratorContractTest \
            --tests com.tarun.kahani.BundledFilmAssetsTest \
            --tests com.tarun.kahani.ReviewProtocolTest \
            --tests com.tarun.kahani.ScreenplayNotesTest \
            --tests com.tarun.kahani.SeatContinuityTest \
            --tests com.tarun.kahani.SheetPanelsTest \
            --tests com.tarun.kahani.DashboardSoakTest \
            --tests com.tarun.kahani.ThreeStoriesSoakTest 2>&1 | tee tools/robotest/build/test.log
      - name: Name the failing tests (annotations, readable through the API)
        if: failure()
        shell: bash
        run: |
          n=0
          for f in $(grep -l "<failure\|<error" tools/robotest/build/test-results/test/*.xml 2>/dev/null); do
            echo "::warning title=failing-results::$(basename "$f")"
            python3 - "$f" <<'PY' || true
          import sys, xml.etree.ElementTree as ET
          try:
              t = ET.parse(sys.argv[1]).getroot()
              for tc in t.iter('testcase'):
                  for k in ('failure', 'error'):
                      e = tc.find(k)
                      if e is None: continue
                      msg = e.get('message') or ''
                      if not msg:
                          lines = (e.text or '').strip().splitlines()
                          msg = lines[0] if lines else k
                      print('::error title=%s.%s::%s' % (tc.get('classname'), tc.get('name'), msg.replace('\n', ' ')[:600]))
          except Exception as ex:
              print('::error title=parse::%s %s' % (sys.argv[1], ex))
          PY
            n=$((n+1)); [ $n -ge 12 ] && break
          done
          echo "failing result files: $n"
          # the gradle output itself: the lines that say what went wrong (ten annotations at most)
          if [ -s tools/robotest/build/test.log ]; then
            grep -nE "FAILED|Caused by|OutOfMemoryError|What went wrong|Execution failed|non-zero exit|tests completed|Exception in|Could not|No tests found|Timeout|timed out" tools/robotest/build/test.log | grep -v "^.*warning" | tail -9 | cut -c1-900 | while IFS= read -r line; do echo "::error title=gradle::$line"; done
            echo "::error title=gradle-tail::$(tail -c 900 tools/robotest/build/test.log | tr '\n' ' ')"
          fi
          ls tools/robotest/build/test-results/test/ 2>/dev/null | head -40
      - name: Upload generated visual audit contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KahaniFilm-1000-pass-visual-audit
          path: tools/robotest/build/frames/
          if-no-files-found: warn
          retention-days: 30

