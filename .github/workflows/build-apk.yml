name: Build KahaniFilm APK

on:
  workflow_dispatch:
  push:
    branches:
      - kahanifilm-development
      - mesh-rigging-v46

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-23" "platforms;android-34" "build-tools;34.0.0"

      - name: Install build utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip apksigner zipalign
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Prepare debug signing key
        shell: bash
        run: |
          mkdir -p tools
          if [ ! -f tools/debug.keystore ]; then
            keytool -genkeypair \
              -keystore tools/debug.keystore \
              -storepass android \
              -keypass android \
              -alias kahani \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KahaniFilm,O=Development,C=IN" \
              -noprompt
          fi

      - name: Install DEX compiler
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/d8.jar https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.3.37/r8-8.3.37.jar
          cat <<'WRAPPER' | sudo tee /usr/local/bin/dalvik-exchange >/dev/null
          #!/usr/bin/env bash
          set -euo pipefail
          out=""
          min_api=26
          input=""
          while (($#)); do
            case "$1" in
              --dex) shift ;;
              --min-sdk-version=*) min_api="${1#*=}"; shift ;;
              --min-sdk-version) min_api="$2"; shift 2 ;;
              --output=*) out="${1#*=}"; shift ;;
              --output) out="$2"; shift 2 ;;
              *) input="$1"; shift ;;
            esac
          done
          if [[ -z "$out" || -z "$input" || ! -d "$input" ]]; then
            echo "dalvik-exchange: expected --output=<file.dex> and a class directory" >&2
            exit 2
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/dex"
          jar --create --file "$tmp/program.jar" -C "$input" .
          java -cp /tmp/d8.jar com.android.tools.r8.D8 --min-api "$min_api" --output "$tmp/dex" "$tmp/program.jar"
          test -s "$tmp/dex/classes.dex"
          mkdir -p "$(dirname "$out")"
          cp "$tmp/dex/classes.dex" "$out"
          WRAPPER
          sudo chmod +x /usr/local/bin/dalvik-exchange

      - name: Build APK
        shell: bash
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-23/android.jar
          ALL_JAR: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
        run: |
          bash ./build.sh

      - name: Smoke-test procedural meshes and renders
        shell: bash
        run: |
          mkdir -p build/test-classes
          javac -source 8 -target 8 -encoding UTF-8 -cp build/classes -d build/test-classes tools/jvm/com/tarun/kahani/jvm/WorldAssetSmokeTest.java
          java -cp build/classes:build/test-classes com.tarun.kahani.jvm.WorldAssetSmokeTest

      - name: Verify APK
        shell: bash
        run: |
          test -s release/KahaniFilm.apk
          ls -lh release/KahaniFilm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KahaniFilm-debug-apk
          path: release/KahaniFilm.apk
          if-no-files-found: error
