name: Build KahaniFilm APK

on:
  workflow_dispatch:
  push:
    branches:
      - kahanifilm-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" was removed from the Android SDK repository; install only current packages.
          packages: platform-tools

      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-23" "platforms;android-34" "build-tools;34.0.0"

      - name: Install build utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Prepare debug signing key
        shell: bash
        run: |
          mkdir -p tools
          if [ ! -f tools/debug.keystore ]; then
            keytool -genkeypair \
              -keystore tools/debug.keystore \
              -storepass android \
              -keypass android \
              -alias kahani \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KahaniFilm,O=Development,C=IN" \
              -noprompt
          fi

      - name: Import and validate both films' committed asset packets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/film-assets"
          for archive in Aakhiri_Chai_Assets_Part1.zip Aakhiri_Chai_Assets_Part2.zip Babu_Ke_Liye_Assets_Part1.zip Babu_Ke_Liye_Assets_Part2.zip; do
            test -s "$archive" || { echo "::error::Missing committed archive: $archive"; exit 1; }
            echo "Validating $archive"
            unzip -t "$archive"
            unzip -oq "$archive" -d "$RUNNER_TEMP/film-assets"
          done
          ROOT="$RUNNER_TEMP/film-assets"
          echo "Archive extraction inventory:"
          find "$ROOT" -type f -printf '%p %s bytes\n' | sort | head -250

          # The Aakhiri Chai MP4 files are split into chunks to keep each upload packet manageable.
          while IFS= read -r -d '' first; do
            second="${first%.chunk1}.chunk2"
            output="${first%.chunk1}"
            test -s "$second" || { echo "::error::Missing paired video chunk: $second"; exit 1; }
            cat "$first" "$second" > "$output"
            test -s "$output" || { echo "::error::Reassembled video is empty: $output"; exit 1; }
            magic="$(dd if="$output" bs=1 skip=4 count=4 2>/dev/null)"
            test "$magic" = "ftyp" || { echo "::error::Invalid MP4 header for $output ($magic)"; exit 1; }
            echo "Reassembled MP4: $output ($(wc -c < "$output") bytes)"
          done < <(find "$ROOT" -type f -name '*.mp4.chunk1' -print0)

          # Copy the source reference assets and fully reassembled videos into the CI test fixtures.
          for film in aakhiri_chai babu_ke_liye; do
            mkdir -p "tools/testdata/$film"
            if [ -d "$ROOT/$film" ]; then
              cp -a "$ROOT/$film/." "tools/testdata/$film/"
            else
              echo "::error::Expected film directory not found: $ROOT/$film"
              exit 1
            fi
          done
          echo "Reference asset inventory in testdata:"
          find tools/testdata/aakhiri_chai tools/testdata/babu_ke_liye -type f -printf '%p %s bytes\n' | sort
          test "$(find tools/testdata/aakhiri_chai -type f -name '*.mp4' | wc -l)" -ge 3
          test "$(find tools/testdata/babu_ke_liye -type f -name '*.mp4' | wc -l)" -ge 2

      - name: Build APK
        shell: bash
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-23/android.jar
          ALL_JAR: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
        run: |
          bash ./build.sh

      - name: Verify APK
        shell: bash
        run: |
          test -s release/KahaniFilm.apk
          ls -lh release/KahaniFilm.apk


      - name: Set up Java 21 for production-plan regression tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Robolectric Android framework
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/kahani"
          URL_PATH="org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar"
          curl -fL --retry 3 --retry-delay 2 -o "$HOME/.cache/kahani/android-all-14.jar" "https://repo.maven.apache.org/maven2/$URL_PATH" \
            || curl -fL --retry 3 --retry-delay 2 -o "$HOME/.cache/kahani/android-all-14.jar" "https://repo1.maven.org/maven2/$URL_PATH"

      - name: Run production-plan, app regression, and 1,000-pass render soak tests
        shell: bash
        run: |
          gradle -p tools/robotest test \
            --tests com.tarun.kahani.ProductionPlanTest \
            --tests com.tarun.kahani.AppTest \
            --tests com.tarun.kahani.HundredPassSoakTest \
            --tests com.tarun.kahani.AakhiriChaiAcceptanceTest \
            --tests com.tarun.kahani.AakhiriChaiDesktopRenderTest
      - name: Upload generated visual audit contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KahaniFilm-1000-pass-visual-audit
          path: tools/robotest/build/frames/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KahaniFilm-debug-apk
          path: release/KahaniFilm.apk
          if-no-files-found: error
