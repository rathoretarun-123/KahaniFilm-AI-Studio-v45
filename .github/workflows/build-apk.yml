name: Build KahaniFilm APK

on:
  workflow_dispatch:
  push:
    branches:
      - kahanifilm-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" was removed from the Android SDK repository; install only current packages.
          packages: platform-tools

      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-23" "platforms;android-34" "build-tools;34.0.0"

      - name: Install build utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Prepare debug signing key
        shell: bash
        run: |
          mkdir -p tools
          if [ ! -f tools/debug.keystore ]; then
            keytool -genkeypair \
              -keystore tools/debug.keystore \
              -storepass android \
              -keypass android \
              -alias kahani \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KahaniFilm,O=Development,C=IN" \
              -noprompt
          fi

      - name: Build APK
        shell: bash
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-23/android.jar
          ALL_JAR: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
        run: |
          bash ./build.sh

      - name: Verify APK
        shell: bash
        run: |
          test -s release/KahaniFilm.apk
          ls -lh release/KahaniFilm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KahaniFilm-debug-apk
          path: release/KahaniFilm.apk
          if-no-files-found: error
