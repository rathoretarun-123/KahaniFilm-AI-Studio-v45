name: Build KahaniFilm for Windows

# v48 (the user: "convert it to exe", then "looking like the apk"): KahaniFilm.exe — the app's screens (tools/jvm/.../app/DesktopApp) over the
# desktop film engine (MakeFilm) with a window, its own Java, ffmpeg, the face/pose models and Kokoro-82M's voices
# through sherpa-onnx's own program. Published as a GitHub Release: KahaniFilm-Windows.zip (unzip, run KahaniFilm.exe).

on:
  push:
    branches: [ccr-a5fc4eef-d2p2nm]
    paths:
      - "app/src/main/java/com/tarun/kahani/core/**"
      - "tools/jvm/**"
      - "app/src/main/java/com/tarun/kahani/app/StudioPlan.java"
      - "app/src/main/assets/models/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 (with jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch ONNX Runtime, sherpa-onnx, Kokoro and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::failed at line $LINENO: $BASH_COMMAND"' ERR
          mkdir -p dl
          get() { for i in 1 2 3 4; do curl -fL --retry 3 -o "$2" "$1" && return 0; sleep $((i * 8)); done; return 1; }
          get https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime/1.20.0/onnxruntime-1.20.0.jar dl/onnxruntime.jar
          get https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-win-x64-shared-MT-Release.tar.bz2 dl/sherpa.tar.bz2
          get https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2 dl/kokoro.tar.bz2
          get https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip dl/ffmpeg.zip
          # (the runtime's debug symbols and the other systems' native libraries are not needed on Windows)
          7z d dl/onnxruntime.jar "ai/onnxruntime/native/win-x64/*.pdb" "ai/onnxruntime/native/linux-*" "ai/onnxruntime/native/osx-*" > /dev/null
          ls -la dl

      - name: Compile the film engine and the window
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::failed at line $LINENO: $BASH_COMMAND"' ERR
          mkdir -p build/classes build/input
          javac -nowarn -encoding UTF-8 -source 17 -target 17 -cp dl/onnxruntime.jar -d build/classes \
            $(find app/src/main/java/com/tarun/kahani/core tools/jvm -name '*.java') app/src/main/java/com/tarun/kahani/app/StudioPlan.java
          jar cfe build/input/KahaniFilm.jar com.tarun.kahani.app.DesktopApp -C build/classes .
          cp dl/onnxruntime.jar build/input/

      - name: Package KahaniFilm.exe (jpackage)
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::failed at line $LINENO: $BASH_COMMAND"' ERR
          VER="48.0.${GITHUB_RUN_NUMBER}"
          # (the runtime keeps its java.exe: each film is made in a Java of its own)
          jpackage --type app-image --name KahaniFilm --app-version "48.0" --vendor "KahaniFilm" \
            --input build/input --main-jar KahaniFilm.jar --main-class com.tarun.kahani.app.DesktopApp \
            --java-options "-Xmx2g" --java-options "-Dfile.encoding=UTF-8" --java-options "-Dstdout.encoding=UTF-8" \
            --jlink-options "--strip-debug --no-header-files --no-man-pages" \
            --dest build/image
          APP=build/image/KahaniFilm/app
          test -f build/image/KahaniFilm/KahaniFilm.exe
          test -f build/image/KahaniFilm/runtime/bin/java.exe
          # the models, sounds, voices and fonts the engine reads (not the bundled story packs)
          mkdir -p "$APP/assets"
          for d in models sounds voices fonts sample; do cp -r "app/src/main/assets/$d" "$APP/assets/"; done
          cp app/src/main/assets/*.txt app/src/main/assets/*.json "$APP/assets/" 2>/dev/null || true
          # sherpa-onnx's speaker with its libraries beside it
          mkdir -p dl/sherpa "$APP/sherpa"
          # (7-Zip unpacks the .tar.bz2: the runner's tar may have no bzip2)
          7z x dl/sherpa.tar.bz2 -odl > /dev/null && 7z x dl/sherpa.tar -odl/sherpa > /dev/null
          EXE=$(find dl/sherpa -name sherpa-onnx-offline-tts.exe | head -1)
          test -n "$EXE"
          cp "$EXE" "$APP/sherpa/"
          find dl/sherpa -name '*.dll' -exec cp -n {} "$APP/sherpa/" \;
          ls -la "$APP/sherpa"
          # Kokoro-82M (Apache-2.0) with espeak-ng's data (GPL-3.0, its notice beside it)
          mkdir -p "$APP/kokoro"
          7z x dl/kokoro.tar.bz2 -odl > /dev/null && 7z x dl/kokoro.tar -odl/k > /dev/null
          K=dl/k/kokoro-multi-lang-v1_0
          cp -r "$K"/model.onnx "$K"/voices.bin "$K"/tokens.txt "$K"/lexicon-us-en.txt "$K"/lexicon-gb-en.txt "$K"/LICENSE "$K"/espeak-ng-data "$APP/kokoro/"
          cp tools/tts/KOKORO_NOTICE.txt "$APP/kokoro/NOTICE.txt"
          # ffmpeg (GPL build from gyan.dev, its licence beside it)
          mkdir -p dl/ff "$APP/ffmpeg"
          7z x dl/ffmpeg.zip -odl/ff > /dev/null
          cp dl/ff/*/bin/ffmpeg.exe "$APP/ffmpeg/"
          cp dl/ff/*/LICENSE "$APP/ffmpeg/LICENSE.txt" 2>/dev/null || true
          cp tools/windows/README-Windows.txt build/image/KahaniFilm/README.txt
          du -sh build/image/KahaniFilm
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Smoke test (a film made without a window)
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::failed at line $LINENO: $BASH_COMMAND"' ERR
          APP=build/image/KahaniFilm
          mkdir -p smoke
          cp tools/testdata/aakhiri_jodi/aakhiri_jodi_numbered.txt smoke/story.txt
          W=$(pwd -W)
          A="$W/build/image/KahaniFilm/app"
          "$APP/runtime/bin/java.exe" -Dkahani.home="$A" -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 \
            -cp "$A/KahaniFilm.jar;$A/onnxruntime.jar" com.tarun.kahani.jvm.KahaniDesktop "$W/smoke/story.txt" - 640 | tee smoke/log.txt
          if [ ! -s smoke/story.mp4 ]; then
            tail -25 smoke/log.txt | sed 's/^/::error::/'
            [ -f smoke/story_film/log.txt ] && tail -25 smoke/story_film/log.txt | sed 's/^/::error::engine: /'
            exit 1
          fi
          grep -q "by Kokoro-82M" smoke/log.txt
          # the face, body and lips models really run on Windows (ModelCheck prints what each one found)
          "$APP/runtime/bin/java.exe" -Dkahani.assets="$A/assets" -Dstdout.encoding=UTF-8 -cp "$A/KahaniFilm.jar;$A/onnxruntime.jar" \
            com.tarun.kahani.jvm.ModelCheck "$W/tools/testdata/aakhiri_chitthi/stills/pari_standing_front.jpg" \
            "$W/tools/testdata/aakhiri_chitthi/stills/grandpa_standing_front.jpg" | tee smoke/models.txt
          grep -q "MODELS WORK" smoke/models.txt
          grep "loaded\|RESULT\|body:" smoke/models.txt | sed 's/^/::notice::/' 
          grep "VOICES\|MODELS" smoke/log.txt

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/image/KahaniFilm -DestinationPath KahaniFilm-Windows.zip -CompressionLevel Optimal

      - name: Publish as a GitHub Release (direct download link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo "::error::failed at line $LINENO: $BASH_COMMAND"' ERR
          short=$(git rev-parse --short HEAD)
          tag="win-v48-build-${GITHUB_RUN_NUMBER}-${short}"
          gh release create "$tag" KahaniFilm-Windows.zip --target "$GITHUB_SHA" \
            --title "KahaniFilm for Windows v48 build ${GITHUB_RUN_NUMBER} (${short})" \
            --notes "Unzip, then run KahaniFilm\\KahaniFilm.exe: New story or Open a script, the Studio for the pictures, Make the film. See README.txt."
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/KahaniFilm-Windows.zip"
